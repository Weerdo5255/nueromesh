name = "calculator"
version = "1.2.0"
description = "Mathematics: arithmetic (exact fractions, powers, roots, logs, trig), equations and systems of equations, inequalities, expanding and factoring, derivatives, integrals, limits, sums, primes and factors, statistics and matrices. Asks a director for any quantity it does not know."
entrypoint = "tool.py"
permissions = []
keywords = ['re:\d\s*([-+*/x^×÷·]|\*\*)\s*[\d({\[]', 're:[)}\]]\s*[-+*/^×÷·]', 're:\\(frac|sqrt|cdot|times)\b', "calculate", "compute", "plus", "minus", "times", "multiplied",
            "divided", "+", "*", "/", "=", "work out", "sum of", "power of", "cubed", "squared", "square root", "percent", "%",
            're:\bsolve\b', 're:\bequation', 're:\bderivative\b', 're:\bdifferentiate\b', 're:\bintegra(l|te)\b',
            're:\blimit of\b', 're:\bfactori[sz]e\b|\bprime factors?\b|\bfactor\s+(\d|[a-z]\s*\^|\()', 're:\bis \d+ (a )?prime\b',
            're:\b(gcd|lcm|greatest common|least common)\b', 're:\d\s*!', 're:\bfactorial\b',
            're:\b(sin|cos|tan|ln|log|sqrt|exp)\s*\(', 're:\b(mean|median|average|standard deviation|variance) of\s+-?\d',
            're:\bdeterminant\b|\binverse of \[', 're:\d+\s+choose\s+\d+', 're:[a-z]\s*\^\s*\d', 're:\d[a-z]\b\s*[-+=]',
            're:\b(expand|simplify)\s*\(', 're:\bfibonacci\b', 're:\d+(st|nd|rd|th) prime\b', 're:\bin (binary|hex|octal)\b']
timeout_s = 10

# Used by the offline teacher to write practice orders for routing.
templates = ["what is {a} {op} {b}", "calculate {a} {op} {b}", "compute {a} {op} {b} please",
             "{a} {op} {b} = ?", "can you work out {a} {op} {b}", "what's {a} {op} {b}",
             "solve {eq}", "solve for x: {eq}", "find x if {eq}", "what is the derivative of {fx}", "differentiate {fx}",
             "integrate {fx}", "integral of {fx} from 0 to {b}", "is {n} prime", "factor {n}", "prime factors of {n}",
             "gcd of {g} and {b}", "{b} choose {k}", "mean of {list}", "what is sqrt({b}) + {a}",
             "limit of {fx} as x approaches {k}", "expand {poly}", "factor {poly}"]

[fillers]
a = ["3", "7", "12", "19", "25", "42", "64", "99", "128", "250", "1000", "3.5"]
b = ["2", "4", "6", "8", "11", "13", "17", "20", "36", "75"]
op = ["+", "*", "/", "plus", "minus", "times", "divided by", "multiplied by", "to the power of"]
eq = ["2x + 3 = 11", "x^2 - 5x + 6 = 0", "3x - 7 = 2x + 4", "x^2 = 49", "5y - 2 = 13", "x/4 + 1 = 3",
      "2x + y = 7, x - y = 2", "x^3 - 8 = 0"]
fx = ["x^2", "3x^3 - 2x", "sin(x)", "e^x", "x^2 + 4x + 4", "ln(x)", "cos(2x)", "1/x"]
n = ["97", "360", "1001", "221", "7919", "4096", "1234567"]
k = ["2", "3", "4", "0", "1"]
g = ["12", "18", "24", "30", "45", "100"]
list = ["3, 5, 7, 9", "2, 4, 4, 4, 5, 5, 7, 9", "10, 20, 30", "1.5, 2.5, 3.5"]
poly = ["(x + 1)^2", "(x - 2)(x + 3)", "x^2 - 9", "x^2 + 5x + 6", "(2x + 1)^3"]

# Self-tests run in the sandbox before the tool is activated.
[[examples]]
input = "what is 12 * 7"
expect = "84"

[[examples]]
input = "calculate 100 divided by 8"
expect = "12.5"

[[examples]]
input = "19 plus 23 minus 2 = ?"
expect = "40"

[[examples]]
input = "solve x^2 - 5x + 6 = 0"
expect = "x = 2 or x = 3"
route = false                           # a self-test only, not routing data

[[examples]]
input = "what is the derivative of x^3 + 2x"
expect = "3x^2 + 2"
route = false                           # a self-test only, not routing data

[[examples]]
input = "integrate x^2 from 0 to 3"
expect = "9"
route = false                           # a self-test only, not routing data

[[examples]]
input = "calculate: {2 + 3} * [4 - 1]"
expect = "15"
route = false                           # braces, brackets and a label with a colon

[[examples]]
input = "\\frac{3}{4} \\cdot 8"
expect = "6"
route = false                           # LaTeX
