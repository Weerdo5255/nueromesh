name = "kiwix"
version = "1.2.0"
description = "Looks a topic up on a local Kiwix server (kiwix-serve: offline Wikipedia and other ZIM archives) and returns the article as knowledge the mesh retains. Preferred over Wikipedia and not rate-limited (see [research] in directives.toml)."
entrypoint = "tool.py"
permissions = ["network"]      # HTTP to the Kiwix server -> needs a human's approval once (P3)
provides = "knowledge"         # results are retained in the knowledge store and recalled later
keywords = ["tell me about", "who was", "who is", "who were", "what is", "what was", "where is", "research",
            "look up", "kiwix", "offline", "what do you know about", "background on", "history of", "learn about"]
timeout_s = 30
persistent = true              # it stays running (tool.py --serve): kept-alive connections, a cache, books searched at once

templates = ["tell me about {topic}", "who was {person}", "what is {thing}", "research {topic}",
             "look up {topic} on kiwix", "what do you know about {topic}", "give me background on {topic}",
             "where is {place}", "history of {topic}"]

[fillers]
topic = ["the Roman Empire", "photosynthesis", "the Krebs cycle", "jazz", "the Apollo program", "black holes",
         "the printing press", "volcanoes", "the French Revolution", "machine learning"]
person = ["Ada Lovelace", "Marie Curie", "Alan Turing", "Nikola Tesla", "Frida Kahlo", "Isaac Newton"]
thing = ["a neutron star", "the Higgs boson", "DNA", "a transistor", "plate tectonics", "the Internet"]
place = ["Kyoto", "the Atacama Desert", "Lake Baikal", "Machu Picchu", "Reykjavik"]

# Passed to the tool on every run; override in directives.toml [tools.config.kiwix], or start
# NeuroMesh with --kiwix http://host:port.
[config]
url = "http://localhost:8080"  # where kiwix-serve listens (a prefix such as http://host/kiwix works too)
servers = []                   # more kiwix-serve servers to search after it (e.g. ["http://nas:8081"])
books = []                     # ZIM names to search, in order (e.g. ["wikipedia_en_all_maxi_2024-01"]);
                               # empty: every book served, Wikipedia ones in your language first
language = "eng"               # preferred book language (ISO 639-3, as in the Kiwix catalog)
use_proxy = false              # talk to the server directly, even if HTTP(S)_PROXY is set
max_passages = 40
links = 8

# Self-test: the server answers and serves at least one book (no assumption about which ZIMs).
[[examples]]
input = "__selftest__"
expect = "kiwix ok"
route = false                  # not a routing example for orders
