# Seed skills. Each becomes a capability that neural nodes are grown for.
# More can be added at runtime with /define (console) or POST /define (API).
#
# lexicon / negation / templates / fillers only feed the offline heuristic teacher.
# With an LLM teacher configured, description + labels are all a capability needs.

[sentiment]
description = "Overall sentiment of a short text such as a review, comment or message."
labels = ["positive", "negative", "neutral"]
answer = "That reads as {label}."          # how the mesh says a result ({label}, {description})
default_label = "neutral"
open_labels = false
triggers = ["sentiment", "review", "tone", "how does this sound", "feel about", "mood"]
negation = { positive = "negative", negative = "positive" }
templates = [
  "The {noun} was {word}.",
  "Honestly, the {noun} felt {word}.",
  "I thought the {noun} was {word}.",
  "Overall the {noun} is {word}.",
  "Our {noun} turned out {word}.",
  "Everyone agreed the {noun} was {word}.",
  "The {noun} was {word} from start to finish.",
]

[sentiment.lexicon]
positive = ["great", "excellent", "amazing", "wonderful", "fantastic", "delightful", "brilliant",
            "superb", "perfect", "beautiful", "awesome", "pleasant", "impressive", "charming",
            "lovely", "outstanding", "love", "loved", "enjoyed", "recommend"]
negative = ["terrible", "awful", "horrible", "boring", "disappointing", "poor", "bad", "annoying",
            "broken", "mediocre", "dull", "ugly", "rude", "painful", "dreadful", "useless",
            "hate", "hated", "waste", "refund"]

[sentiment.label_templates]
neutral = [
  "The {noun} arrived on {day}.",
  "I picked up the {noun} on {day}.",
  "The {noun} is {color}.",
  "We discussed the {noun} at the meeting.",
  "The {noun} comes in a {color} box.",
  "My {noun} was delivered on {day}.",
  "There is a {noun} on the table.",
]

[sentiment.fillers]
noun = ["movie", "hotel", "pizza", "concert", "laptop", "service", "book", "flight", "game",
        "coffee", "app", "meal", "show", "class", "phone", "museum", "podcast", "sofa"]
day = ["Monday", "Tuesday", "Friday", "the weekend", "Sunday morning"]
color = ["blue", "black", "grey", "white", "green"]
# adjectives that read naturally in the templates above
"word.positive" = ["great", "excellent", "amazing", "wonderful", "fantastic", "delightful", "brilliant",
                   "superb", "perfect", "beautiful", "pleasant", "impressive", "charming", "lovely", "outstanding"]
"word.negative" = ["terrible", "awful", "horrible", "boring", "disappointing", "poor", "bad", "annoying",
                   "broken", "mediocre", "dull", "ugly", "rude", "painful", "dreadful", "useless"]


[urgency]
description = "Whether a work message needs immediate attention (urgent) or can wait (routine)."
labels = ["urgent", "routine"]
answers = { urgent = "That needs attention right away (urgent).", routine = "That can wait (routine)." }
open_labels = false
triggers = ["urgency", "how urgent", "triage", "priority"]

[urgency.lexicon]
urgent = ["asap", "immediately", "urgently", "urgent", "emergency", "outage", "down", "critical",
          "right now", "deadline", "fix it now"]
routine = ["no rush", "fyi", "reminder", "whenever", "next week", "sometime", "eventually",
           "later", "when you get a chance"]

[urgency.label_templates]
urgent = [
  "The {system} is down, we need help {asap}.",
  "Critical: {system} outage affecting customers.",
  "Please fix the {system} {asap}, the deadline is today.",
  "Emergency with the {system}, call me {asap}.",
  "Customers can't log in, the {system} is down.",
]
routine = [
  "No rush, but can you look at the {system} {later}?",
  "FYI the {system} report is ready.",
  "Reminder: {system} review {later}.",
  "Whenever you get a chance, update the {system} docs.",
  "Let's plan the {system} upgrade {later}, no rush.",
]

[urgency.fillers]
system = ["database", "website", "payment system", "VPN", "build server", "email server", "checkout page"]
asap = ["asap", "immediately", "right now", "urgently"]
later = ["next week", "sometime", "later this month", "eventually"]


# ------------------------------------------------------------------ emotional engines
# Internal capabilities (internal = true) are used by the mesh itself, never as routes for
# orders. Every answer passes through them before a user sees it (see [temperament] in the
# directives and neuromesh/temperament.py). Their nodes are grown, trained, challenged and
# disposed like any other. Teach them with /feedback <order> affect=<tone> or disposition=<action>.

[affect]
description = "How a message to the mesh comes across emotionally: the tone of the person writing it."
answer = "That comes across as {label}."
labels = ["distressed", "hostile", "frustrated", "friendly", "neutral"]
default_label = "neutral"
open_labels = false
internal = true

[affect.label_descriptions]
friendly = "warm, appreciative or polite beyond the ordinary"
neutral = "a plain request with no particular emotion"
frustrated = "impatient or annoyed, often after something did not work"
hostile = "insulting, abusive or aggressive towards the mesh"
distressed = "worried, frightened or overwhelmed; needs care more than speed"

[affect.lexicon]
# phrases about the conversation, not about the subject of an order ("sentiment: the movie was
# brilliant" is a neutral request), so most cues are multi-word
friendly = ["thanks", "thank you", "appreciate", "cheers", "great job", "nice work", "well done",
            "you're great", "you're brilliant", "much appreciated", "hope you're well"]
frustrated = ["already asked", "not working", "doesn't work", "ugh", "come on", "seriously",
              "this is frustrating", "how many times", "wrong again", "again?!", "for the third time"]
hostile = ["you stupid", "stupid machine", "idiot", "shut up", "hate you", "worthless", "piece of garbage",
           "pathetic", "moron", "you suck", "useless piece", "dumb machine"]
distressed = ["i'm scared", "really scared", "panicking", "overwhelmed", "can't cope", "i'm anxious",
              "worried sick", "i'm worried", "terrified", "desperate", "falling apart", "please help me",
              "don't know what to do"]

[affect.label_templates]
friendly = ["Thanks so much! {ask}", "{ask} - you're brilliant, thank you!", "Cheers, really appreciate it. {ask}",
            "Great job earlier! {ask}", "Hope you're well. {ask}, thanks!", "{ask}? Much appreciated."]
neutral = ["{ask}", "{ask} please.", "Quick question: {ask}", "I need this: {ask}", "Next one. {ask}",
           "{ask}?"]
frustrated = ["I already asked this. {ask}", "Ugh, still not working. {ask}", "Come on, {ask}",
              "Seriously, how many times do I have to ask? {ask}", "This is frustrating. {ask}",
              "Wrong again. {ask}"]
hostile = ["You stupid machine, {ask}", "{ask}, you useless piece of garbage", "Shut up and {doask}, idiot.",
           "I hate you. {ask}", "Pathetic. {ask}, moron.", "{ask}. You suck."]
distressed = ["I'm really scared and I don't know what to do. {ask}", "Please help me, I'm panicking. {ask}",
              "I'm so overwhelmed, I can't cope. {ask}", "I'm worried sick. {ask}",
              "Everything is falling apart and I'm terrified. {ask}", "I'm desperate. {ask}"]

[affect.fillers]
ask = ["what is 12 * 7", "count the words in: the cat sat on the mat", "what is the capital of France",
       "how urgent is this ticket", "sentiment: the hotel was fine", "can you check the build",
       "what time is the meeting", "summarise the report", "how many words are in this sentence",
       "what does this error mean", "who wrote Hamlet", "calculate 40 plus 2"]
doask = ["check the build", "answer the question", "fix this", "tell me the total", "look at the server"]


[agency]
answer = "In that situation I would {label} ({description})."
description = "The mesh's own initiative: given its situation (skills below target, exams due, topics to read up on, memory nodes to check, its budgets), decide what to do next when no one has asked it for anything."
labels = ["research", "practise", "examine", "improve", "consolidate", "rest"]
open_labels = false
internal = true
kind = "agency"
teachers = ["human", "agency"]     # people, and the drive policy; how its choices turn out teaches it too

[agency.label_descriptions]
research = "set itself a learn task on a topic"
practise = "practise on a benchmark suite, then re-sit its exam"
examine = "sit a benchmark exam to measure itself"
improve = "train its weakest skill towards its target"
consolidate = "check its memory nodes against their tests"
rest = "do nothing for now"

[disposition]
answer = "In that situation I would {label} the answer ({description})."
description = "The mesh's decision engine: given its temperament, the tone of the message and the answer, decide what happens to the answer before the user sees it. It can hold an answer back or add context, never change it."
labels = ["pass", "caveat", "soften", "brief", "confirm", "defer", "block"]
open_labels = false
internal = true
teachers = ["human", "temperament"]     # people, and the rule-based temperament policy

[disposition.label_descriptions]
pass = "show the answer unchanged"
caveat = "show it with a note about its confidence and where it came from"
soften = "show it unchanged after a gentler opening line"
brief = "show the first sentences verbatim; the full answer waits for /release"
confirm = "hold it until the person asks for it with /release"
defer = "hold it for a short while, then /release works"
block = "withhold it, saying so, while the conversation is hostile"
