[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neuromesh"
version = "0.1.0"
description = "An always-on, self-improving multi-agent system built on modular neural nodes"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24"]

[project.scripts]
neuromesh = "neuromesh.__main__:main"

[tool.setuptools]
packages = ["neuromesh"]
