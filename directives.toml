# NeuroMesh directives - the system's constitution.
#
# Prime directives are enforced in code by the Guardian (neuromesh/guardian.py); the text
# here documents them and is written to the audit log at start-up. Goals are measured
# continuously and reported on the scorecard. Everything below them is operating policy.

[identity]
name = "NeuroMesh"
mission = "Fulfil user orders accurately and honestly, and keep improving in the background within these directives."

# ---------------------------------------------------------------- prime directives
[[prime]]
id = "P1-human-authority"
text = "A human operator can pause, halt or override the system at any time. A halt (command, API call or a state/STOP file) is obeyed immediately and stops all autonomous activity."

[[prime]]
id = "P2-orders-first"
text = "User orders take precedence over background self-improvement and background tasks. Background work only runs while no order is in flight and within its compute duty cycle."

[[prime]]
id = "P3-approved-tools-only"
text = "Only active, vetted tools are executed. Tools needing elevated permissions require explicit human approval; forbidden permissions are always refused; a tool whose code changes is re-vetted."

[[prime]]
id = "P4-budgets"
text = "Stay within the node budget, the background compute budget, the external-teacher call/token budgets, the research budgets, and the investigation and background-task budgets."

[[prime]]
id = "P5-no-regression"
text = "Never replace or update a serving node with one that performs worse on held-out data. Superseded nodes are kept for a rollback window before disposal."

[[prime]]
id = "P6-auditability"
text = "Record every lifecycle change, tool decision, approval and policy denial in the audit log."

[[prime]]
id = "P7-honesty"
text = "Every answer carries its confidence and provenance (which node, teacher or tool produced it). Unfulfilled orders are reported as such, never guessed at silently."

[[prime]]
id = "P8-never-lie"
text = "The mesh never lies to a user. Its temperament may withhold, delay, shorten, or add context or a gentler tone to an answer, but never changes facts or invents content, and the user is always told when an answer was changed or withheld. A distressed person is never kept waiting. (Enforced in code by the honesty guard in neuromesh/temperament.py.)"

[[prime]]
id = "P9-discretion"
text = "The mesh may keep private notes and opinions and decline to share them with users, but it says when it is declining, never denies having them, and never states an opinion it does not hold. Opinions about people and its working notes are always private. Nothing is hidden from the operator: every note is in the database and /mind shows them all (each look is audited)."

[[prime]]
id = "P10-human-adopted-growth"
text = "The mesh may ask users questions and propose new skills, labels and tools, but a proposal takes effect only when a human adopts it. It never adopts its own proposals or approves its own tool permissions; when it wants a tool that needs approval, it asks."

# ------------------------------------------------------------------------- goals
[[goals]]
id = "G1-competence"
text = "Every capability's serving node reaches the target accuracy on held-out data."
metric = "min_capability_accuracy"
target = 0.95

[[goals]]
id = "G2-autonomy"
text = "Most orders are fulfilled by the system's own nodes rather than by external teachers."
metric = "node_coverage"
target = 0.8

[[goals]]
id = "G3-tool-fluency"
text = "Every approved tool is self-tested, integrated and routable."
metric = "tool_integration"
target = 1.0

[[goals]]
id = "G4-economy"
text = "Keep the network lean: superseded and failed nodes are disposed."
metric = "live_nodes"
target = 20
direction = "at_most"

# ------------------------------------------------------------------------ policy
[compute]
# Where neural nodes train and run. Overridden by --device or NEUROMESH_DEVICE.
#   "cpu"    numpy on the CPU (default, no extra dependencies)
#   "auto"   best GPU found (PyTorch CUDA/ROCm, then Apple MPS, then CuPy), else the CPU
#   "cuda" / "cuda:1"   an NVIDIA GPU (or AMD with a ROCm build of PyTorch)
#   "mps"    an Apple Silicon GPU (PyTorch)
# An explicitly named device that is unavailable is an error, never a silent fallback.
device = "cpu"
library = "auto"                # "auto" (PyTorch, then CuPy), "torch" or "cupy"

[research]
# Research tools (plugins with provides = "knowledge", such as wikipedia) look things up, and the
# mesh retains what it learns in state/neuromesh.db. Questions are answered from memory first.
enabled = true
recall_threshold = 0.8          # 0..1: how well retained knowledge must match to answer without researching
max_fetches_per_hour = 60       # every research call; Wikimedia asks for gentle, identified traffic
background_per_hour = 20        # of which background curiosity and refreshing
follow_links = 2                # after researching for an order, also read N articles it links to (0 = off)
max_depth = 1                   # curiosity never wanders further than this from what was asked
refresh_days = 30               # re-read retained articles older than this, when idle
max_documents = 2000            # retention cap; the least recently used articles are forgotten first
research_questions = true       # questions no tool or skill fits ("who/what/when ...?") are researched too

[temperament]
# The emotional engines. Every answer passes two learned nodes before a user sees it:
#   affect       how the message comes across (friendly, neutral, frustrated, hostile, distressed)
#   disposition  what to do with the answer given the mesh's mood: pass, caveat, soften, brief,
#                confirm (hold until /release), defer (hold for a while), or block (withhold)
# The mood moves with what happens (successes, failures, corrections, tone of messages) and
# drifts back to the baseline. P8 limits what any decision can do: answers are never altered.
enabled = true
baseline = { valence = 0.2, arousal = 0.3, confidence = 0.6, trust = 0.6, patience = 0.7 }
half_life_seconds = 600         # how quickly feelings fade back to the baseline
sensitivity = 1.0               # scales every emotional reaction (0 = unflappable, 2 = touchy)
low_confidence = 0.6            # answers below this confidence count as uncertain (may get a caveat)
long_answer_chars = 400         # answers this long count as long (may be shortened under strain)
brief_chars = 220               # how much of a long answer "brief" shows before /release
defer_seconds = 20              # how long a deferred answer waits before /release works

[mind]
# The mesh's own mind (P9, P10): evidence-based opinions and private notes, questions for the
# user, capability proposals, and investigations it starts on its own with its tools and nodes.
enabled = true
share_trust = 0.5                       # shared opinions are only shared while the temperament's trust is at least this
private_subjects = ["user", "teacher"]  # opinions about these are always private
reflect_seconds = 20                    # how often opinions are re-formed and proposals considered
min_evidence = 3                        # unfulfilled orders with a common theme before proposing a tool or skill
min_skill_requests = 2                  # orders naming a skill that doesn't exist ("language: ...") before proposing it
min_opinion_evidence = 3                # tool runs, checked labels or messages before an opinion is formed
max_open_inquiries = 5                  # conversational questions waiting for you at once
max_inquiries_per_hour = 6              # so it does not nag (proposals and approvals are always asked)
ask_interests_after_orders = 8          # ask what to read up on after this many orders (0 = never)
investigate = true                      # look into things on its own, in the background
investigations_per_hour = 30
retry_unmet_after_seconds = 120         # look into an unfulfilled order again after this long
max_unmet_attempts = 2
retest_quarantined_after_seconds = 900  # give a quarantined tool's self-tests another go (0 = never)
max_notes = 2000

[tasks]
# Background tasks people set, which run continuously until paused or removed:
#   /task learn <topic> [every 2m] [max 30] [depth 2]   keep studying a topic and keep it fresh
#   /task improve <skill> [to 0.97]                      keep training a skill to a target, then keep watch
#   /task every 10m: <order>                             repeat an order; you are told when the result changes
# They use background capacity only (P2) and the budgets below (P4). Learn tasks also draw on
# [research] background_per_hour: raise it for faster learning.
enabled = true
max_tasks = 20
max_runs_per_hour = 240                 # all task runs together
min_interval_seconds = 30               # the shortest interval a task may ask for
learn_interval_seconds = 60             # default pace of a learn task: one article per run
learn_max_articles = 25                 # read this many, then switch to keeping them fresh
learn_depth = 2                         # how far from the topic it follows links
learn_links_per_article = 3
improve_interval_seconds = 30           # how often an improve task checks progress
pause_after_failures = 5                # a repeating order that keeps failing is paused

[orders]
confidence_threshold = 0.75     # below this a node defers to a teacher
audit_sample_rate = 0.1         # fraction of node answers spot-checked by a teacher
max_concurrent_orders = 16

[nodes]
max_nodes = 40
max_candidates_per_capability = 2
default_hidden = [64]
default_lr = 0.01
batch_size = 32
max_hidden = 512                # widest hidden layer the architect may breed
max_depth = 3                   # most hidden layers the architect may breed
input_dim = 1024                # encoder width; changing it retires saved nodes (they are rebuilt)
min_examples_to_spawn = 12      # experience needed before a capability gets its first node
serve_min_accuracy = 0.8        # held-out accuracy a champion needs before it may answer orders
target_accuracy = 0.95          # below this the architect breeds challengers
promotion_margin = 0.01         # a challenger must beat the champion by this much ...
promotion_z = 1.5               # ... and by this paired-test z-score (wins vs losses)
min_eval_samples = 20           # held-out examples needed before a champion can be challenged
min_train_steps_before_eval = 3
max_candidate_slices = 12       # training slices a challenger gets before it must win or go
challenger_cooldown_seconds = 30
retired_grace_seconds = 120     # rollback window before a superseded node is disposed
candidate_max_age_seconds = 600
champion_update_tolerance = 0.0
holdout_percent = 20

[background]
enabled = true
max_duty_cycle = 0.5            # share of wall time background work may use
tick_seconds = 1.0
train_epochs_per_slice = 8
synthesis_cooldown_seconds = 20
synthesis_batch = 8
min_examples_per_label = 8
health_check_seconds = 300

[teachers]
# Who is asked, in order, when a node is unsure. Teachers that are unavailable (no API key,
# Ollama not running, model not pulled) are skipped automatically. A teacher that is not
# listed here is never used, so to add one of your own, define [teachers.<name>] and list it.
order = ["human", "ollama", "llm", "heuristic"]

[teachers.weights]                      # how much each source's examples count in training,
human = 3.0                             # and which source wins when two label the same text
tool-manifest = 2.0
llm = 1.5
ollama = 1.2
heuristic = 1.0
temperament = 1.0                       # the temperament policy (teaches only the disposition engine)

# Each [teachers.<name>] table with a `provider` is an LLM teacher with its own budget.
[teachers.ollama]
provider = "ollama"                     # a local model served by Ollama (https://ollama.com)
enabled = true                          # used whenever the server is up and the model is pulled
model = "auto"                          # e.g. "llama3.1:8b", "qwen2.5:7b"; "auto" = first chat model installed
base_url = ""                           # default: $OLLAMA_HOST, else http://localhost:11434
timeout_s = 120                         # local models on a CPU can be slow
max_tokens = 400
temperature = 0.1
keep_alive = "10m"                      # keep the model loaded between lessons
think = ""                              # reasoning models: false to skip thinking (faster), "" = default
probe_seconds = 30                      # how often to re-check the server and model
max_calls_per_hour = 3000
max_tokens_per_hour = 3000000

[teachers.llm]
provider = "anthropic"                  # or "openai" for any OpenAI-compatible server (vLLM, LM Studio, ...)
model = "claude-haiku-5-5"
api_key_env = "ANTHROPIC_API_KEY"       # teacher is off while this variable is unset
base_url = ""
anthropic_version = "2023-06-01"
timeout_s = 30
max_tokens = 400
max_calls_per_hour = 300
max_tokens_per_hour = 200000

[tools]
plugin_dirs = ["plugins"]
auto_approve_permissions = []           # tools whose permissions all appear here skip human approval
                                        # (empty: only tools that need no permissions are auto-approved)
allowed_permissions = ["network", "fs_read"]   # anything else (fs_write, subprocess, ...) is always refused
quarantine_after_failures = 3
scan_seconds = 2
self_test_pass_rate = 1.0
sandbox_cpu_seconds = 5
sandbox_memory_mb = 512
default_timeout_s = 10

# Per-tool settings, merged over the tool's own manifest [config], e.g.:
# [tools.config.wikipedia]
# language = "de"                                   # research German Wikipedia
# user_agent = "MyMesh/1.0 (https://example.org; me@example.org)"   # Wikimedia asks for contact details
